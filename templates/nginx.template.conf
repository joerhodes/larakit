server {

    %LISTEN%

    server_name %SERVERNAME%;
    root %WEBROOT%;
    index index.php index.html index.htm;

    location / {
         try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index %UPSTREAM%;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;

        %LMS%
        fastcgi_param LMS_CLIENT %LMSCLIENT%;
        fastcgi_param LMS_LIVE %LMSLIVE%;
        fastcgi_param LMS_SSL_URL %SSLURL%;
        fastcgi_param LMS_NONSSL_URL %NONSSLURL%;
        fastcgi_param LMS_DSN %LMSDSN%;
        fastcgi_param YUI_BASE %YUIBASE%;
        fastcgi_param PHP_ADMIN_VALUE "session.save_path = /var/www/sessions/%LMSCLIENT%";
        %ENDLMS%
    }

    location ~ /\.ht {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    %LMS%
    location /css {
        rewrite ^/css/(.*\.css) /css/combine_css.php?$1;
    }

    location /lf {
        rewrite ^/lf/([^/]*)/([^/]*) /front.php?controller=$1&action=$2;
    }

    location /var/www/$LMS_CLIENT%/lms/htdocs {
        allow all;
    }

    location /var/www/symfony/data/web/sf {
        allow all;
    }

    location /api {
        rewrite ^/api/(.*) http://$server_name/api/$1 redirect;
    }

    location /fact_finder {
        rewrite ^/fact_finder/(.*) http://$server_name/fact_finder/$1 redirect;
    }

    location /uafc {
        rewrite ^/uafc/(.*) http://$server_name/uafc/$1 redirect;
    }
    %ENDLMS%

    error_log %ERRORLOG%;
    access_log %ACCESSLOG%;
}
