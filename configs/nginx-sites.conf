# defined the 'elapsed' log format
log_format elapsed '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent $request_time "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

## load server config from each project - new school
include /var/www/*/*/nginx.docker.conf;

# load server config from each project - old school
include /var/www/*/nginx.docker.conf;
