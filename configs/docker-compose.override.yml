version: '3'

services:
    workspace:
        volumes:
            - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
            - ~/SitesHome:/home
            - ~/.composer:/root/.composer
        environment:
            - SSH_AUTH_SOCK=/run/host-services/ssh-auth.sock
    php-fpm:
        volumes:
            - ~/SitesHome:/home
    php-worker:
        volumes:
            - ~/SitesHome:/home
